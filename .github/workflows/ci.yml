name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

  schedule:
    - cron: "0 6 * * 1"
      timezone: "Europe/Stockholm"

  workflow_dispatch:
    inputs:
      csv_file:
        description: "Välj CSV-fil att validera"
        required: true
        type: choice
        default: "kundbas.csv"
        options:
          - "kundbas.csv"
          - "kundbas_ny_leverans.csv"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  datakontroll:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-project
        with:
          python-version: "3.11"
      - name: Validate customer data
        env:
          CSV_FILE: ${{ inputs.csv_file || 'kundbas.csv' }}
        run: python -m kontroller.validera "data/$CSV_FILE"

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-project
        with:
          python-version: ${{ matrix.python-version }}
          install-dev: "true"

      - name: Run unit tests
        run: python -m pytest --ignore=tests/test_api.py

  dependency-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-project
        with:
          python-version: "3.11"

      - name: List installed runtime dependencies
        run: pip freeze --exclude-editable > installed.txt

      - name: Scan dependencies for known vulnerabilities
        id: audit
        run: |
          pipx run --spec pip-audit==2.9.0 pip-audit \
            --requirement installed.txt \
            --no-deps \
            --disable-pip \
            --aliases \
            --progress-spinner off \
            --format markdown \
            --output audit.md

      - name: Write scan summary
        if: always()
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          {
            echo "## Dependency scan"
            echo
            echo "Scanned $(wc -l < installed.txt) installed packages."
            echo
            if [[ "$AUDIT_OUTCOME" == "success" ]]; then
              echo "No known vulnerabilities found."
            elif [[ -s audit.md ]]; then
              cat audit.md
            else
              echo "The scan could not be completed, see the log."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  train:
    needs: [test, datakontroll, dependency-scan]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-project
        with:
          python-version: "3.11"

      - run: python -m churn.model

      - name: "Demo: tamper with the model"
        run: printf 'x' >> outputs/modell.joblib

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: modell-${{ github.sha }}
          path: outputs/
          if-no-files-found: error

  evaluate:
    needs: train
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-project
        with:
          python-version: "3.11"
          install-dev: "true"

      - name: Download model artifact
        uses: actions/download-artifact@v4
        with:
          name: modell-${{ github.sha }}
          path: outputs/

      - name: Test FastAPI
        run: pytest tests/test_api.py -v

      - name: Write model summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          metrics = json.loads(
              Path("outputs/matvarden.json").read_text()
          )

          print("## Modellutvärdering")
          print()
          print("| Mätvärde | Värde |")
          print("|---|---|")
          print(f"| ROC AUC | {metrics['roc_auc']:.4f} |")
          print(f"| Accuracy | {metrics['accuracy']:.4f} |")
          print(f"| Commit | `{metrics['commit']}` |")
          print(f"| Data SHA256 | `{metrics['data_sha256']}` |")
          PY

      - name: Evaluate model
        run: python -m churn.evaluate

      - name: Check model regression against champion
        run: python -m churn.regression_gate

  docker-smoke:
    needs: evaluate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Download model artifact
        uses: actions/download-artifact@v4
        with:
          name: modell-${{ github.sha }}
          path: outputs/

      - name: Build Docker image
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            -t churn-score:${{ github.sha }} .

      - name: Run scoring inside container
        run: |
          docker run --name smoke \
            -e ANTAL=5 \
            churn-score:${{ github.sha }}

      - name: Check ringlista
        run: |
          docker cp smoke:/app/outputs/ringlista.csv ringlista.csv

          python3 - <<'PY'
          import csv
          from pathlib import Path

          with Path("ringlista.csv").open(newline="") as file:
              rows = list(csv.DictReader(file))

          assert len(rows) == 5, f"Expected 5 rows, got {len(rows)}"
          assert all(
              0 <= float(row["risk"]) <= 1
              for row in rows
          ), "Risk outside [0, 1]"

          print(f"OK: {len(rows)} customers scored")
          PY

      - name: Save Docker image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: docker save churn-score:${{ github.sha }} -o image.tar

      - name: Upload Docker image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ github.sha }}
          path: image.tar
          if-no-files-found: error

      - name: Remove smoke test container
        if: always()
        run: docker rm -f smoke 2>/dev/null || true

  docker-api-smoke:
    needs: evaluate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Download model artifact
        uses: actions/download-artifact@v4
        with:
          name: modell-${{ github.sha }}
          path: outputs/

      - name: Build API image
        run: |
          docker build \
            -f Dockerfile.API \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            -t churn-api:${{ github.sha }} .

      - name: Start API container
        run: docker run -d --name api-smoke -p 8000:8000 churn-api:${{ github.sha }}

      - name: Wait for API health
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/health && exit 0
            sleep 1
          done
          docker logs api-smoke
          exit 1

      - name: Check prediction
        run: |
          curl -fsS -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"alder": 42, "manader_som_kund": 18, "manadskostnad": 399, "data_gb_per_manad": 25, "supportarenden_12m": 3, "region": "Stockholm", "abonnemang": "Bas"}' \
            -o prediction.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          risk = json.loads(Path("prediction.json").read_text())["churn_risk"]
          assert 0 <= risk <= 1, f"Risk outside [0, 1]: {risk}"

          print(f"OK: churn_risk={risk}")
          PY
      - name: Save Docker image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: docker save churn-api:${{ github.sha }} -o api-image.tar

      - name: Upload Docker image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: docker-api-image-${{ github.sha }}
          path: api-image.tar
          if-no-files-found: error

      - name: Remove API container
        if: always()
        run: docker rm -f api-smoke 2>/dev/null || true

  publish:
    needs: docker-smoke
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image-${{ github.sha }}

      - name: Load Docker image
        run: docker load -i image.tar

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push image
        run: |
          IMAGE="ghcr.io/pytt156/churn-mlops-pipeline:${{ github.sha }}"
          docker tag churn-score:${{ github.sha }} "$IMAGE"
          docker push "$IMAGE"

  ringlista:
    needs: evaluate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-project
        with:
          python-version: "3.11"

      - name: Download approved model
        uses: actions/download-artifact@v4
        with:
          name: modell-${{ github.sha }}
          path: outputs/

      - name: Generate ringlista
        run: python -m churn.score

      - name: Upload ringlista
        uses: actions/upload-artifact@v4
        with:
          name: ringlista-${{ github.sha }}
          path: outputs/ringlista.csv
          if-no-files-found: error
